name: Android debug build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install SVG icon tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin imagemagick
      - name: Generate Android launcher icons from the supplied SVG
        run: |
          test -s app/src/main/res/drawable/mishkat_logo.svg
          mkdir -p app/src/main/res/mipmap-mdpi app/src/main/res/mipmap-hdpi app/src/main/res/mipmap-xhdpi app/src/main/res/mipmap-xxhdpi app/src/main/res/mipmap-xxxhdpi app/src/main/res/mipmap-anydpi-v26
          rsvg-convert --width=216 --height=216 app/src/main/res/drawable/mishkat_logo.svg > /tmp/mishkat-foreground.png
          for spec in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
            density="${spec%%:*}"
            size="${spec##*:}"
            rsvg-convert --width=$((size / 2)) --height=$((size / 2)) app/src/main/res/drawable/mishkat_logo.svg > /tmp/mishkat-small.png
            convert -size ${size}x${size} xc:"#771a32" /tmp/mishkat-small.png -gravity center -composite app/src/main/res/mipmap-${density}/ic_launcher.png
            cp app/src/main/res/mipmap-${density}/ic_launcher.png app/src/main/res/mipmap-${density}/ic_launcher_round.png
          done
          convert -size 432x432 xc:none /tmp/mishkat-foreground.png -gravity center -composite app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/mishkat_icon_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          rm app/src/main/res/drawable/mishkat_logo.svg
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle testDebugUnitTest
      - name: Run Android lint
        run: gradle lintDebug
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mishkat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
